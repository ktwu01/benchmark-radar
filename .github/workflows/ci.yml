name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Provenance audits verify immutable source commits with git show.
          # A shallow checkout cannot read those historical blobs.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      # Both generators run before pytest, and in this order.
      #
      # site/data/benchmark-index.json, the 1,148 shards and radar.json are all
      # derived and untracked, so a fresh checkout has none of them.
      # `normalize-external` writes the first two and `classify` writes the
      # third from them, which is why the order is fixed: reversed, classify
      # globs a shard directory that does not exist yet and builds the crawled
      # half of site/data/models.json out of nothing.
      #
      # Running both before pytest is what makes the corpus-backed tests
      # execute. `needs_corpus` in tests/test_models_registry.py skips on a
      # missing radar.json or shard directory, so with either generator after
      # pytest those tests skip, and they had never run in CI at all -- which
      # is how a models.json short by 321 models could stay green.
      - run: benchmark-radar normalize-external
      - run: benchmark-radar classify
      - run: benchmark-radar build-data-release
      - run: pytest -q
