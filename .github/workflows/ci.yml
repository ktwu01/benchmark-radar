name: CI

# Markdown is not tested, except the READMEs and the technical report.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**/*.md"
      - "README*.md"
      - "docs/technical-report/**"
  pull_request:
    paths:
      - "**"
      - "!**/*.md"
      - "README*.md"
      - "docs/technical-report/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      # A fresh checkout has no index, shards or radar.json. Build the shared
      # catalog before classification, then package that exact corpus before
      # running tests so missing source records cannot hide behind stale files.
      - run: benchmark-radar normalize-catalog
      - run: benchmark-radar classify
      - run: benchmark-radar build-data-release
      - run: pytest -q
