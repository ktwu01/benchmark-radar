name: Daily Benchmark Radar

on:
  schedule:
    # One run daily at 05:00 UTC = 13:00 Asia/Singapore (UTC+8, no DST).
    # arXiv's category RSS bulletin is dated 04:00 UTC; the former 01:00 UTC
    # run could finish before that day's feed was populated and miss a paper
    # until the following scan (issue #379). Keep one predictable daily run,
    # but place it after the source we promise to cover has published.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      publish:
        # Issue #88: the daily Issue is back as the posting checklist surface.
        # Default to true so a plain manual dispatch still creates or updates
        # today's Issue; opting out is the explicit minority case.
        description: Publish or update today's daily social-checklist Issue
        required: true
        type: boolean
        default: true

concurrency:
  group: daily-benchmark-radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-report:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Report schedule latency
        if: github.event_name == 'schedule'
        env:
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          read -r scheduled_minute scheduled_hour _ <<< "${SCHEDULE_EXPRESSION}"
          started_at="$(date -u +%s)"
          scheduled_at="$(date -u --date "$(date -u +%F) ${scheduled_hour}:${scheduled_minute}:00" +%s)"
          if (( started_at < scheduled_at )); then
            scheduled_at="$((scheduled_at - 86400))"
          fi
          latency_minutes="$(((started_at - scheduled_at) / 60))"
          {
            echo "### Schedule timing"
            echo "- Cron target: \`${SCHEDULE_EXPRESSION}\`"
            echo "- Scheduled UTC: \`$(date -u --date "@${scheduled_at}" --iso-8601=seconds)\`"
            echo "- Runner start UTC: \`$(date -u --date "@${started_at}" --iso-8601=seconds)\`"
            echo "- Trigger latency: **${latency_minutes} minutes**"
          } >> "${GITHUB_STEP_SUMMARY}"
          if (( latency_minutes >= 240 )); then
            echo "::warning title=Delayed scheduled trigger::GitHub started this workflow ${latency_minutes} minutes after its cron target"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A queued/manual run must build from the latest main, not the event
          # SHA captured when it was dispatched. Otherwise its full-history
          # artifact can be older than the snapshot commit it eventually writes.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Collect evidence and public attention
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENREVIEW_USERNAME: ${{ secrets.OPENREVIEW_USERNAME }}
          OPENREVIEW_PASSWORD: ${{ secrets.OPENREVIEW_PASSWORD }}
          # Publishing a deterministic fallback would look successful while
          # violating the purpose of this production run: prove a real GPT
          # synthesis occurred and retain its model/usage metadata.
          OPENAI_BRIEFING_REQUIRED: "true"
          # Issue #159: the Q&A implementation shipped opt-in behind this flag
          # and production never set it, so every run silently skipped
          # question generation despite a successful briefing. Enabling and
          # requiring it here closes that gap the same way the briefing is
          # required above: a green run must carry real answers, not a quiet
          # absence.
          OPENAI_QUESTIONS: "true"
          OPENAI_QUESTIONS_REQUIRED: "true"
          # Issue #231: render the day's GPT briefing and Q&A prose in
          # Simplified Chinese as well. Each flag is independent; a failed
          # translation never fails the run, it just leaves the zh fields out.
          OPENAI_BRIEFING_ZH: "true"
          OPENAI_QUESTIONS_ZH: "true"
        run: benchmark-radar
      # The day's social post material used to live on a daily GitHub Issue
      # (issue #88), but that Issue stopped earning its keep once the dashboard
      # and site/feed.xml became the reading and subscription surfaces (issue
      # #37). The material is now rendered deterministically here as
      # out/social.md and fetched from the evidence artifact. The full-history
      # checkout above feeds the repo-change sentence; a shallow clone would
      # report "no code changes" on most days.
      - name: Render daily social post material
        run: >
          benchmark-radar social
          --items out/items.json
          --repo .
          --channels config/social.yml
          --social-output out/social.md
      - name: Isolate the target-day snapshot
        shell: bash
        run: |
          set -euo pipefail
          snapshot_date="$(python -c 'import datetime, json; value=json.load(open("out/items.json", encoding="utf-8"))["generated_at"]; print(datetime.datetime.fromisoformat(value.replace("Z", "+00:00")).date().isoformat())')"
          cp "data/snapshots/${snapshot_date}.json" "out/snapshot-${snapshot_date}.json"
          printf '%s\n' "${snapshot_date}" > out/snapshot-date.txt
      - name: Upload evidence artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-radar-${{ github.run_id }}
          path: |
            out/
            data/snapshots/
            site/data/radar.json
          retention-days: 30

  persist-snapshot:
    needs: build-report
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create snapshot-writer token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RADAR_APP_ID }}
          private-key: ${{ secrets.RADAR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: benchmark-radar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Download validated snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-radar-${{ github.run_id }}
          path: generated/
      - name: Persist UTC snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/snapshots
          snapshot_date="$(cat generated/out/snapshot-date.txt)"
          snapshot_path="generated/out/snapshot-${snapshot_date}.json"
          test -f "${snapshot_path}"
          if test -f "data/snapshots/${snapshot_date}.json"; then
            current_generated="$(jq -r '.generated_at' "data/snapshots/${snapshot_date}.json")"
            incoming_generated="$(jq -r '.generated_at' "${snapshot_path}")"
            if [[ "${current_generated}" > "${incoming_generated}" ]]; then
              echo "::error::Refusing to replace a newer ${snapshot_date} snapshot"
              exit 1
            fi
          fi
          cp "${snapshot_path}" "data/snapshots/${snapshot_date}.json"
          git config user.name "benchmark-radar[bot]"
          git config user.email "benchmark-radar[bot]@users.noreply.github.com"
          git add data/snapshots
          if git diff --cached --name-only |
            grep -Ev '^data/snapshots/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$'
          then
            echo "::error::Snapshot writer attempted to modify an unexpected path"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "UTC snapshot is already current"
            exit 0
          fi
          git commit -m "Record daily radar snapshot"
          git push origin HEAD:main

  # Issue #88: one daily Issue carrying only the day's social posting checklist.
  # The dashboard and site/feed.xml remain the reading surface (issue #37), so
  # the Issue does not duplicate the report; its body is just the rendered
  # out/social.md section. A rerun re-applies ticks the user already made on
  # that day's OPEN Issue so posting progress is never reset. A closed Issue is
  # never reused: once the user closes that day's checklist, the next trigger
  # opens a fresh one for the same day with the re-rendered channel list. The
  # social section is rendered deterministically here (never by a model) from
  # the artifact's items.json plus the last 24 hours of git history.
  publish-issue:
    needs: [build-report, persist-snapshot]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Checkout before downloading the artifact: actions/checkout clears a
      # non-repository workspace, which would delete a previously downloaded
      # generated/ directory. main is checked out explicitly so the repo-change
      # sentence also counts the snapshot commit persist-snapshot pushes while
      # this workflow is running, instead of the stale event SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Download validated report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-radar-${{ github.run_id }}
          path: generated/
      # The repo-change sentence reads the last 24 hours of git history, which
      # the full fetch above provides rather than the default shallow single
      # commit.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Create idempotent daily social-checklist issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # The issue must be tied to the report's own day, not the wall clock:
          # a manual or delayed run crossing midnight UTC would otherwise date
          # today's checklist with tomorrow, and the next day's run would then
          # update that same issue and conflate two checklists.
          date_key="$(python -c 'import json,sys,datetime,os
          body=json.load(open("generated/out/items.json", encoding="utf-8"))
          print(datetime.datetime.fromisoformat(body["generated_at"]).astimezone(datetime.timezone.utc).strftime("%Y-%m-%d"))')"
          title="🗣 Daily social checklist — ${date_key}"
          existing="$(gh issue list --state open --search "\"${title}\" in:title" \
            --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -1)"
          existing_body_args=()
          if [[ -n "${existing}" ]]; then
            gh issue view "${existing}" --json body --jq .body > generated/out/current_body.md
            existing_body_args=(--existing-body generated/out/current_body.md)
          fi
          benchmark-radar social \
            --items generated/out/items.json \
            --repo . \
            --channels config/social.yml \
            "${existing_body_args[@]}" \
            --social-output generated/out/body.md
          if [[ -n "${existing}" ]]; then
            gh issue edit "${existing}" --body-file generated/out/body.md \
              --add-label automated --add-label traction --remove-label daily-radar
            echo "Updated issue #${existing}"
          else
            gh issue create --title "${title}" --body-file generated/out/body.md \
              --label automated --label traction
          fi
