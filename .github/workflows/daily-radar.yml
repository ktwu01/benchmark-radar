name: Daily Benchmark Radar

on:
  schedule:
    # Issue #44: one early run catches overnight arXiv/HF activity before the
    # day starts. The mid-morning run provides same-day retry coverage and a
    # second discovery window: on 2026-08-02 it found 27 evidence items missed
    # by the early run (41 appeared in both; 21 appeared only in the early run).
    # Issue #104 makes the two runs additive. Both land in early hours Chicago.
    # 06:15 UTC = 01:15 America/Chicago during daylight saving time.
    - cron: "15 6 * * *"
    # 12:15 UTC = 07:15 America/Chicago during daylight saving time.
    - cron: "15 12 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish or update today's GitHub Issue
        required: true
        type: boolean
        default: false

concurrency:
  group: daily-benchmark-radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-report:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Report schedule latency
        if: github.event_name == 'schedule'
        env:
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          read -r scheduled_minute scheduled_hour _ <<< "${SCHEDULE_EXPRESSION}"
          started_at="$(date -u +%s)"
          scheduled_at="$(date -u --date "$(date -u +%F) ${scheduled_hour}:${scheduled_minute}:00" +%s)"
          if (( started_at < scheduled_at )); then
            scheduled_at="$((scheduled_at - 86400))"
          fi
          latency_minutes="$(((started_at - scheduled_at) / 60))"
          {
            echo "### Schedule timing"
            echo "- Cron target: \`${SCHEDULE_EXPRESSION}\`"
            echo "- Scheduled UTC: \`$(date -u --date "@${scheduled_at}" --iso-8601=seconds)\`"
            echo "- Runner start UTC: \`$(date -u --date "@${started_at}" --iso-8601=seconds)\`"
            echo "- Trigger latency: **${latency_minutes} minutes**"
          } >> "${GITHUB_STEP_SUMMARY}"
          if (( latency_minutes >= 240 )); then
            echo "::warning title=Delayed scheduled trigger::GitHub started this workflow ${latency_minutes} minutes after its cron target"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Collect evidence and public attention
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: benchmark-radar
      - name: Upload evidence artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-radar-${{ github.run_id }}
          path: |
            out/
            data/snapshots/
            site/data/radar.json
          retention-days: 30

  persist-snapshot:
    needs: build-report
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create snapshot-writer token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RADAR_APP_ID }}
          private-key: ${{ secrets.RADAR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: benchmark-radar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Download validated snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-radar-${{ github.run_id }}
          path: generated/
      - name: Persist UTC snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/snapshots
          cp generated/data/snapshots/*.json data/snapshots/
          git config user.name "benchmark-radar[bot]"
          git config user.email "benchmark-radar[bot]@users.noreply.github.com"
          git add data/snapshots
          if git diff --cached --name-only |
            grep -Ev '^data/snapshots/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$'
          then
            echo "::error::Snapshot writer attempted to modify an unexpected path"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "UTC snapshot is already current"
            exit 0
          fi
          git commit -m "Record daily radar snapshot"
          git push origin HEAD:main

  publish-issue:
    needs: [build-report, persist-snapshot]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download validated report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-radar-${{ github.run_id }}
          path: generated/
      - name: Create idempotent daily issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          date_key="$(date -u +%Y-%m-%d)"
          title="📡 AI Benchmark & Data Radar — ${date_key}"
          existing="$(gh issue list --state all --search "\"${title}\" in:title" \
            --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -1)"
          if [[ -n "${existing}" ]]; then
            gh issue edit "${existing}" --body-file generated/out/report.md
            echo "Updated issue #${existing}"
          else
            gh issue create --title "${title}" --body-file generated/out/report.md \
              --label daily-radar --label automated
          fi
