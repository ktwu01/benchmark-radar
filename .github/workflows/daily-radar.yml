name: Daily Benchmark Radar

on:
  schedule:
    # 12:15 UTC = 07:15 America/Chicago during daylight saving time.
    - cron: "15 12 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish or update today's GitHub Issue
        required: true
        type: boolean
        default: false

concurrency:
  group: daily-benchmark-radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-report:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Collect and render
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: benchmark-radar
      - name: Upload evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-radar-${{ github.run_id }}
          path: out/
          retention-days: 30

  publish-issue:
    needs: build-report
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download validated report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: benchmark-radar-${{ github.run_id }}
          path: out/
      - name: Create idempotent daily issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_DATE: ${{ github.run_started_at }}
        shell: bash
        run: |
          set -euo pipefail
          date_key="${ISSUE_DATE:0:10}"
          title="📡 AI Benchmark & Data Radar — ${date_key}"
          existing="$(gh issue list --state all --search "\"${title}\" in:title" \
            --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -1)"
          if [[ -n "${existing}" ]]; then
            gh issue edit "${existing}" --body-file out/report.md
            echo "Updated issue #${existing}"
          else
            gh issue create --title "${title}" --body-file out/report.md \
              --label daily-radar --label automated
          fi
