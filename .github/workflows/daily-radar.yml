name: Daily Benchmark Radar

on:
  schedule:
    # 12:15 UTC = 07:15 America/Chicago during daylight saving time.
    - cron: "15 12 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish or update today's GitHub Issue
        required: true
        type: boolean
        default: false

concurrency:
  group: daily-benchmark-radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-report:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Collect and render
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: benchmark-radar
      - name: Upload evidence artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-radar-${{ github.run_id }}
          path: out/
          retention-days: 30

  publish-issue:
    needs: build-report
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download validated report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-radar-${{ github.run_id }}
          path: out/
      - name: Create idempotent daily issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          date_key="$(date -u +%Y-%m-%d)"
          title="📡 AI Benchmark & Data Radar — ${date_key}"
          existing="$(gh issue list --state all --search "\"${title}\" in:title" \
            --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -1)"
          if [[ -n "${existing}" ]]; then
            gh issue edit "${existing}" --body-file out/report.md
            echo "Updated issue #${existing}"
          else
            gh issue create --title "${title}" --body-file out/report.md \
              --label daily-radar --label automated
          fi
