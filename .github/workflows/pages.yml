name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - "data/snapshots/**"
      # The curated Model Card Adoption Rank is a deploy input like the
      # snapshots are: a maintenance commit that only adds a model card must
      # rebuild the dashboard, or the published ranking silently stays behind
      # the registry until some unrelated change happens to trigger Pages.
      - "data/model_cards.yml"
      - "site/**"
      - "src/benchmark_radar/snapshots.py"
      - "src/benchmark_radar/corpus.py"
      - "src/benchmark_radar/model_cards.py"
      # Both run during the build and write files into the artifact, so a change
      # to either one only reaches the published site if it also triggers a
      # deploy. Without these, editing the share-card generator or the export
      # layer succeeds, merges, and changes nothing that anyone can see.
      - "scripts/generate_og_image.py"
      - "src/benchmark_radar/export.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build validated dashboard data
        run: |
          python -m pip install -e '.[dev]'
          benchmark-radar rebuild
          # Standalone citable artifacts alongside the dashboard bundle (issue
          # #88). Written into site/data/ so they deploy with the rest of the
          # site and resolve at a stable URL: an embedded badge or a citation
          # pointing at a release asset breaks on the next release, while one
          # pointing here tracks the registry.
          benchmark-radar export
          # Regenerated rather than served from the commit, so a share card can
          # never advertise counts the registry has moved past.
          python scripts/generate_og_image.py
          pytest -q
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
