name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - "data/snapshots/**"
      # Report documents and scores feed the same catalog as source snapshots.
      - "data/model_cards.yml"
      # benchmark_scores.yml feeds the score-progression and insights layers of
      # the same dashboard build, and config.yml sets the published dashboard
      # URL during `benchmark-radar export`, so both are deploy inputs too.
      - "data/benchmark_scores.yml"
      - "config.yml"
      # The catalog build reads the committed crawl CSVs and the
      # reviewed identity rules, and writes the search index and per-benchmark
      # shards into site/data/. Its inputs are deploy inputs: a recrawl or an
      # identity edit must rebuild the published shards, or the site keeps
      # serving last month's catalog.
      - "data/leaderboard_snapshots/**"
      # The registry beside those CSVs, not just the CSVs. `normalize-catalog`
      # reads this file for the crawl id, the column mapping and crawled_at, so
      # a commit that only corrects one of those changes the catalog the build
      # produces. Missing here, such a commit would never deploy: the shards it
      # would have changed are ignored now, so there is no companion `site/**`
      # edit left to trigger the build on its behalf.
      - "data/leaderboard_snapshots.yml"
      - "data/catalog/identity.yml"
      - "data/catalog/benchmark_dates.yml"
      - "data/catalog/llm_stats_identity_overrides.yml"
      - "site/**"
      # The dashboard build imports the package transitively through
      # snapshots.py. Keep the trigger broad so a new scoring, insight, rubric,
      # or export dependency cannot merge without rebuilding the published site.
      - "src/benchmark_radar/**"
      - "src/benchmark_radar/snapshots.py"
      - "src/benchmark_radar/feed.py"
      - "src/benchmark_radar/corpus.py"
      - "src/benchmark_radar/model_cards.py"
      - "src/benchmark_radar/cli.py"
      - "src/benchmark_radar/kw_bench*.py"
      # Both run during the build and write files into the artifact, so a change
      # to either one only reaches the published site if it also triggers a
      # deploy. Without these, editing the share-card generator or the export
      # layer succeeds, merges, and changes nothing that anyone can see.
      - "scripts/generate_og_image.py"
      - "src/benchmark_radar/export.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build validated dashboard data
        run: |
          python -m pip install -e '.[dev]'
          # FIRST, because the rest of the build reads what it writes. The
          # search index and the 1,148 per-benchmark shards are derived and
          # untracked, so a fresh checkout has neither, and `classify` builds
          # site/data/models.json by globbing the shard directory for the
          # crawled half of the model registry. Run it after `classify` and
          # models.json records only the 34 curated models instead of all 355,
          # which the registry test cannot catch because it skips itself when
          # the shards are missing. The site would publish the smaller registry
          # with nothing failing.
          #
          # Rebuilding here is also what makes a recrawl or an identity edit
          # reach the published site rather than serving whatever the last
          # commit happened to carry.
          benchmark-radar normalize-catalog
          # The classification store is derived and intentionally untracked.
          # Build it in the fresh Pages checkout before publishing radar.json.
          # The MVP uses NullExtractor, so this makes no external/model calls.
          # This rebuild also writes site/feed.xml from the same validated
          # snapshot history as radar.json (issue #37).
          benchmark-radar classify
          # Build one complete, checksummed archive for installed CLIs. The
          # small manifest ships with Pages; a separate least-privilege job
          # publishes the archive as a bandwidth-safe GitHub Release asset.
          benchmark-radar build-data-release
          # Export Hugging Face dataset release files into site/data/hf_dataset
          benchmark-radar export-hf
          # Standalone citable artifacts alongside the dashboard bundle (issue
          # #88). Written into site/data/ so they deploy with the rest of the
          # site and resolve at a stable URL: an embedded badge or a citation
          # pointing at a release asset breaks on the next release, while one
          # pointing here tracks the registry.
          benchmark-radar export
          # Regenerated rather than served from the commit, so a share card can
          # never advertise counts the registry has moved past.
          python scripts/generate_og_image.py
          # Freeze IDs for any model or organization that appeared since the
          # last run. Never ran in CI before, which is how the registry drifted
          # to 357 models against models.json's 355 and nothing noticed.
          python scripts/build_logo_registry.py
          pytest -q
      - name: Minify the dashboard stylesheet
        run: python scripts/minify_css.py site/assets/styles.css
      - name: Upload CLI data release for publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-data-release
          path: site/data/cli/
          if-no-files-found: error
          retention-days: 1
      - name: Upload Hugging Face dataset release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-dataset-release
          path: site/data/hf_dataset/
          if-no-files-found: error
          retention-days: 1
      - name: Remove CLI archive from Pages artifact
        run: rm site/data/cli/benchmark-radar-data.zip
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/

  publish-cli-data:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download verified CLI data release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-data-release
          path: cli-data-release
      - name: Publish rolling CLI data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view cli-data --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # --latest=false keeps this rolling data drop out of the "Latest"
            # slot. GitHub picks the latest release by creation date, so without
            # it a data upload would displace the newest versioned release in
            # the repository sidebar and at /releases/latest.
            gh release create cli-data \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --latest=false \
              --title "Benchmark Radar CLI data" \
              --notes "Checksummed data used by benchmark-radar init and sync."
          fi
          gh release upload cli-data \
            cli-data-release/benchmark-radar-data.zip \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

  publish-hf-dataset:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download verified HF dataset release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hf-dataset-release
          path: hf-dataset-release
      - name: Install pinned Hugging Face client
        run: python -m pip install 'huggingface_hub==1.31.0'
      - name: Sync to Hugging Face Hub
        if: github.ref == 'refs/heads/main'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ktwu01/benchmark-radar
        run: |
          python -c '
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          repo_id = os.environ["HF_REPO_ID"]
          if not token:
              raise RuntimeError("HF_TOKEN repository secret is not configured")
          api = HfApi(token=token)

          api.create_repo(repo_id=repo_id, repo_type="dataset", exist_ok=True, private=False)
          api.upload_folder(
              folder_path="hf-dataset-release",
              repo_id=repo_id,
              repo_type="dataset",
              commit_message="Automated daily sync from Benchmark Radar CI",
              delete_patterns=["data/*", "manifest.json"],
          )
          print(f"Successfully synced dataset to https://huggingface.co/datasets/{repo_id}")
          '

  deploy:
    needs: [build, publish-cli-data]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
