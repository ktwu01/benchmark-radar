name: Post daily English briefing to X

# Post the day's briefing to X at 8:00 AM US Eastern.
#
# GitHub cron is UTC-only and does not follow daylight saving, so this fires
# at both 12:00 and 13:00 UTC and scripts/post_x.py only proceeds while the
# America/New_York clock reads 8:00-9:59 (see in_eastern_window there):
# 12:00 UTC posts in EDT, 13:00 UTC posts in EST, and the ledger in
# data/x-posts.json keeps the second trigger from ever double-posting.
#
# The day's snapshot and share cards are committed by daily-radar.yml hours
# earlier (05:00 UTC run), so the material is always ready before this fires.
on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Post even outside the 8 AM Eastern window"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Print the post instead of sending it"
        required: false
        type: boolean
        default: false

concurrency:
  group: post-x-en
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create ledger-writer token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RADAR_APP_ID }}
          private-key: ${{ secrets.RADAR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: benchmark-radar

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Post the English briefing to X
        id: post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_POST_FORCE: ${{ inputs.force && '1' || '' }}
        run: >
          python scripts/post_x.py --lang en
          ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Record the post in the ledger
        if: steps.post.outputs.posted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "benchmark-radar[bot]"
          git config user.email "benchmark-radar[bot]@users.noreply.github.com"
          git add data/x-posts.json
          git commit -m "Record X post (en) ${{ steps.post.outputs.snapshot_date }}"
          git push origin HEAD:main || {
            git pull --rebase origin main
            git push origin HEAD:main
          }
