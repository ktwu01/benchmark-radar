name: Post daily English briefing to X

# Post the day's briefing to X every day at 13:00 UTC.
# The day's snapshot and share cards are committed by daily-radar.yml hours
# earlier (05:00 UTC run), so the material is always ready before this fires.
# The ledger in data/x-posts.json keeps a re-run from ever double-posting.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the post instead of sending it"
        required: false
        type: boolean
        default: false

concurrency:
  group: post-x-en
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create ledger-writer token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RADAR_APP_ID }}
          private-key: ${{ secrets.RADAR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: benchmark-radar

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyNaCl (only used to save the rotated refresh token)
        run: python -m pip install --quiet pynacl

      - name: Post the English briefing to X
        id: post
        env:
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}
          X_SECRETS_PAT: ${{ secrets.X_SECRETS_PAT }}
        run: >
          python scripts/post_x.py --lang en
          ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Record the post in the ledger
        if: steps.post.outputs.posted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "benchmark-radar[bot]"
          git config user.email "benchmark-radar[bot]@users.noreply.github.com"
          git add data/x-posts.json
          git commit -m "Record X post (en) ${{ steps.post.outputs.snapshot_date }}"
          git push origin HEAD:main || {
            git pull --rebase origin main
            git push origin HEAD:main
          }
