radar:
  lookback_hours: 48
  # Optional connectors remain non-fatal, but repeated failures must not hide
  # indefinitely inside green scheduled runs.
  optional_source_failure_warning_runs: 3
  # Sources routinely return several hundred rows a day. The previous 60/30
  # pair discarded most of them before anyone could see them, so the dashboard
  # claimed "228 found" while publishing 8 GitHub records.
  max_items_per_source: 300
  # Only the Markdown digest is truncated. Every eligible record is retained
  # in the snapshot and dashboard.
  issue_item_limit: 40
  # Legacy setting name retained for config compatibility. This is a
  # recommendation threshold, not a publication cutoff: eligible records below
  # 40 remain visible without the Recommended badge.
  minimum_score: 40

taxonomy:
  # `challenge set` and `capability eval` matched zero artifacts across all
  # nine snapshots (issue #52 audit) and are dropped: a term that never fires
  # creates an illusion of coverage. `evaluat` replaces `evaluation` as a
  # strict superset under substring matching, picking up "evaluating" and
  # "evaluated"; `corpora` is added because substring matching gets `corpus`
  # but cannot bridge the irregular Latin plural.
  benchmark:
    - benchmark
    - leaderboard
    - test set
    - evaluation suite
  evaluation:
    - evaluat
    - judge model
    - red teaming
    - safety eval
  dataset:
    - dataset
    - corpus
    # Trailing $ closes the right edge: bare `corpora` matched inside
    # "incorporates" and "corporate", tagging unrelated artifacts as datasets.
    - corpora$
    - data collection
    - synthetic data
    - training data
    - preference data
  data_quality:
    - data quality
    - data contamination
    - deduplication
    - data provenance
    - annotation quality
    - benchmark leakage
  # "agent"/"agentic" alone appear in most 2026 ML papers' related work, so
  # this still requires an evaluation noun -- but as a *proximity* rule rather
  # than an adjacent phrase.
  #
  # The previous 12 adjacent phrases matched 16 of 645 artifacts (21.7% recall,
  # issue #52). Six of them matched nothing at all, because real titles put the
  # agent noun last and interpose qualifiers: "A Production-Fidelity Benchmark
  # for LLM-Based Database Operations Agents" contains neither "agent
  # benchmark" nor "benchmark for agent". Requiring the two nouns within 15
  # tokens instead of adjacent reaches 95.0% recall at 75.0% precision,
  # measured against 109 hand-labeled candidates (two independent annotators,
  # Cohen's kappa 0.888). `exclude` drops the residual false positives, which
  # are artifacts that build or survey agents rather than evaluate them.
  agentic:
    within: 15
    any_of: [agent, agents, agentic]
    near:
      [
        benchmark,
        benchmarks,
        benchmarking,
        eval,
        evals,
        evaluation,
        evaluations,
        evaluating,
        evaluate,
        leaderboard,
        harness,
        testbed,
        arena,
        bench,
      ]
    # Genre markers only, anchored to where a paper declares its own type.
    # A bare `survey` would drop "A Benchmark of LLM-Simulated Human Survey
    # Response", a real agent benchmark, because survey response is a subject
    # area as well as a paper genre. `position:` carries no trailing \b: it
    # could never match after the colon, which silently disabled the clause.
    #
    # Kept deliberately short. Per-title exclusions ("unlocking agentic
    # capabilities") were tested and dropped: each removed exactly one
    # artifact from the measurement corpus, which is memorizing the test set
    # rather than stating a rule.
    exclude: '(?:^|: )(?:position:|a survey|survey of|scoping review)|\bwe survey\b'

# Named artifacts worth surfacing whenever they move, regardless of where the
# generic score places them. A watchlist hit is a routing decision, not a
# quality claim: it pins the record to the top of the digest and labels why.
watchlist:
  - name: PaperBench
    aliases: [paperbench, "paper bench"]
    note: OpenAI benchmark for replicating ML research papers end to end.
  - name: MLE-bench
    aliases: [mlebench, "mle-bench", "mle bench"]
    note: OpenAI benchmark scoring agents on Kaggle-style ML engineering tasks.
  - name: MLE-Marathon
    aliases: ["mle-marathon", "mle marathon", mlemarathon]
    note: Long-running variant of the MLE engineering benchmark family.
  - name: PostRainBench
    aliases: [postrainbench, "postrain bench", "post-rain bench"]
    note: Benchmark for post-processing precipitation and rainfall prediction.
  # "long horizon" alone appears in the abstract of most agent papers, so the
  # aliases require the benchmark noun to keep this from matching everything.
  - name: Long-Horizon Bench
    aliases: ["long horizon bench", "long horizon benchmark", longhorizonbench]
    note: Evaluations targeting extended multi-step agent execution.
  - name: RSI-Exam
    aliases: [rsi-exam, "rsi exam"]
    note: Executable long-horizon research benchmark for recursive self-improvement.

sources:
  arxiv:
    enabled: true
    required: true
    # Official category RSS feeds publish an empty bulletin on non-announcement
    # days (notably weekends). A validated empty feed is healthy; HTTP, XML, and
    # connector failures still fail this required source.
    allow_empty: true
    # 48h report window + 120h overlap = seven days. arXiv's Atom published
    # timestamp is submission time, while announcements pause on weekends.
    overlap_hours: 120
    request_delay_seconds: 3
    # GitHub-hosted runners are routinely rate-limited by the Atom API's
    # shared-IP quota. Use official category RSS feeds and filter locally.
    # Atom parsing remains available for deployments with a stable egress IP.
    atom_enabled: false
    # Software-agent benchmarks can be primary cs.SE rather than cross-listed
    # into the three general AI feeds. Include that first-party category so a
    # named SWE benchmark is not dependent on a cross-list (issue #379).
    rss_categories: [cs.AI, cs.CL, cs.CV, cs.SE]
    # "benchmark"/"evaluation"/"dataset" alone match most ML papers, since
    # almost every paper evaluates on some existing benchmark. cs.AI+cs.CL+cs.CV
    # publish 700+ papers a day, and the old bare-word list matched roughly two
    # of every three (issue #51: "111 releases today"). These phrases require
    # the paper to be introducing a benchmark, dataset, or leaderboard, not
    # merely using one, which cuts matches to about one in ten.
    rss_keywords:
      - benchmark for
      # Named suites often end the title with "Bench:" and put the full word
      # only after their name (for example SWE Refactor Bench). The leading
      # space catches that form without matching compounds such as Workbench:
      # or Test-Bench: (issue #379).
      - " bench:"
      - new benchmark
      - novel benchmark
      - benchmark dataset
      - benchmark suite
      - leaderboard
      - evaluation benchmark
      - evaluation suite
      - evaluation dataset
      - we introduce a benchmark
      - we present a benchmark
      - we release a benchmark
      - we introduce a dataset
      - we present a dataset
      - we release a dataset
      - a new dataset for
      - a novel dataset for
      - curated dataset
      - data contamination
      - benchmark leakage
      - agent benchmark
      - agentic benchmark
      - agent evaluation
      - agentic evaluation
      - multi-agent benchmark
      - benchmark for agent
    queries:
      - 'ti:"benchmark" AND (all:"we introduce" OR all:"we present" OR all:"we release")'
      - 'ti:"dataset" AND (all:"we introduce" OR all:"we present" OR all:"we release")'
      - '(all:"data contamination" OR all:"benchmark leakage" OR all:"data quality")'
      - '(all:"agent benchmark" OR all:"agentic benchmark" OR all:"agent evaluation")'

  huggingface:
    enabled: true
    required: true
    # Datasets cover released evaluation corpora; Spaces add public
    # leaderboards and interactive benchmark explorers hosted on the Hub.
    kinds: [datasets, spaces]
    searches:
      - benchmark
      - evaluation
      - leaderboard
      - preference
      - synthetic-data
      - agent benchmark

  github:
    enabled: true
    required: true
    queries:
      - '"LLM benchmark" in:name,description,readme'
      - '"AI evaluation" in:name,description,readme'
      - '"benchmark dataset" in:name,description,readme'
      - '"data contamination" in:name,description,readme'
      - '"agent benchmark" in:name,description,readme'
      - '"agentic benchmark" in:name,description,readme'
      # This named suite does not use the adjacent phrase "agent benchmark".
      # Keep discovery suite-specific: the broader capability phrase also
      # matches trading platforms, automation harnesses, and safety frameworks.
      - '"RSI-Exam" in:name,description,readme'

  # Reviewed public organizations are an additional discovery surface for new
  # repositories whose names may not match generic GitHub search phrases. The
  # registry records source evidence and review dates; organization membership
  # never changes relevance or evidence scoring.
  github_organizations:
    enabled: true
    required: false
    registry_path: data/priority_github_organizations.yml
    tiers: [priority, standard, probation]
    max_organizations: 360
    page_size: 30
    max_pages_per_organization: 1
    max_requests: 360
    attempts: 2
    timeout_seconds: 30

  # A community-surfaced supplementary paper stream. Its items carry the
  # original arXiv identifier for exact cross-source deduplication; the source
  # is discovery evidence, not a replacement for the first-party arXiv feed.
  huggingface_papers:
    enabled: true
    required: false
    page_size: 100
    attempts: 3
    timeout_seconds: 30

  # Public Kaggle datasets cover data releases that may not be mirrored to the
  # Hugging Face Hub. Specific high-signal searches avoid treating every hosted
  # table as an AI benchmark, and normal taxonomy still filters every result.
  kaggle_datasets:
    enabled: true
    required: false
    searches:
      - AI benchmark
      - LLM evaluation
      - agent benchmark
      - benchmark dataset
      - data contamination
      - synthetic data evaluation
    page_size: 20
    max_requests: 6
    attempts: 3
    timeout_seconds: 30

  # DOI-bearing research datasets and evaluation artifacts that are often not
  # mirrored to code hubs or model hubs. The canonical DOI is retained for
  # cross-source identity resolution.
  zenodo:
    enabled: true
    required: false
    searches:
      - AI benchmark
      - LLM evaluation
      - agent benchmark
      - benchmark dataset
      - data contamination
      - synthetic data evaluation
    page_size: 20
    max_requests: 6
    attempts: 3
    timeout_seconds: 30

  # Crossref adds publisher-deposited DOI metadata as an independent discovery
  # path for benchmark papers. Its public API needs no credential; title-focused
  # queries and the shared taxonomy keep generic papers out of the published feed.
  crossref:
    enabled: true
    required: false
    searches:
      - large language model benchmark
      - artificial intelligence evaluation dataset
      - data contamination benchmark
      - agentic benchmark evaluation
    page_size: 50
    max_requests: 4
    attempts: 3
    timeout_seconds: 30

  openreview:
    enabled: true
    venues:
      - ICLR.cc/2026/Conference
      - NeurIPS.cc/2026/Conference
      - ICML.cc/2026/Conference
      - ACLweb.org/ACL/2026/Conference
    page_size: 250
    max_requests: 4
    attempts: 3
    timeout_seconds: 30

  semantic_scholar:
    enabled: true
    searches:
      - large language model benchmark
      - artificial intelligence evaluation dataset
      - data contamination benchmark
      - agentic benchmark evaluation
    page_size: 100
    # The budget is shared across every search, not per search, so a value below
    # the search count silently starves the trailing queries. Five covers all
    # four searches plus one pagination follow-up.
    max_requests: 5
    # A free individual API key starts at one request per second.
    request_delay_seconds: 1.1
    attempts: 3
    timeout_seconds: 30

  github_releases:
    enabled: true
    repositories:
      - stanford-crfm/helm
      - EleutherAI/lm-evaluation-harness
      - LiveBench/LiveBench
      - SWE-bench/SWE-bench
      - evalplus/evalplus
      - openai/evals
      - mlcommons/inference
      - ARCPrize/ARC-AGI
      - arcprize/ARC-AGI-3-Agents
      # Curated first-party benchmark and evaluation repositories. Some
      # projects release infrequently; an empty Releases response is healthy.
      - openai/simple-evals
      - openai/human-eval
      - THUDM/AgentBench
      - THUDM/LongBench
      - modelscope/evalscope
      - open-compass/opencompass
      - huggingface/lighteval
      - embeddings-benchmark/mteb
      - EvolvingLMMs-Lab/lmms-eval
      - LiveCodeBench/LiveCodeBench
      - SWE-agent/SWE-agent
      - lmarena/arena-hard-auto
      - MMMU-Benchmark/MMMU
      - MME-Benchmarks/Video-MME
      - OpenGVLab/MMT-Bench
      - AILab-CVC/SEED-Bench
      - centerforaisafety/HarmBench
      - centerforaisafety/wmdp
      - NVIDIA/garak
      - microsoft/BIPIA
      - OSU-NLP-Group/Mind2Web
      - OpenBMB/ToolBench
      - ServiceNow/BrowserGym
      - web-arena-x/webarena
      - facebookresearch/CRAG
      - confident-ai/deepeval
      - vibrantlabsai/ragas
      - UKGovernmentBEIS/inspect_ai
      - OpenMOSS/VLABench
      - EmbodiedBench/EmbodiedBench
      - thu-coai/SafetyBench
      # First-party model and agent repositories from Alina's feed audit.
      # Their releases enter the radar only when the normal benchmark/data
      # taxonomy finds relevant source text; ordinary model releases drop out.
      - QwenLM/Qwen3
      - QwenLM/Qwen-Agent
      - deepseek-ai/DeepSeek-V3
      - deepseek-ai/DeepSeek-R1
      - PaddlePaddle/ERNIE
      - PaddlePaddle/Paddle
      - Tencent-Hunyuan/HunyuanVideo
      - verl-project/verl
      - zai-org/GLM-4
      - zai-org/CogVideo
      - MoonshotAI/Kimi-k1.5
      - InternLM/InternLM
      - meituan-longcat/LongCat-Next
      - Kwai-Kolors/Kolors
      - MiniMax-AI/MiniMax-01
      - stepfun-ai/Step-Audio
      - stepfun-ai/Step-Video-T2V
      - bytedance/UI-TARS
      - black-forest-labs/flux
      - 01-ai/Yi
      - meta-llama/llama-models
      - openclaw/openclaw
      - karpathy/autoresearch
      - xai-org/grok-1
    page_size: 30
    max_pages_per_repository: 1
    max_requests: 64
    # Invalid future-dated rows may consume a page slot. Replacement requests
    # use a separate cap so they cannot steal the first request from later repos.
    future_replacement_requests: 2
    # Popularity comes from a separate repository endpoint. These requests run
    # only after release collection and use their own cap, so they cannot reduce
    # release coverage when the shared release-page budget is exhausted.
    repository_metadata_requests: 8
    attempts: 3
    timeout_seconds: 30

  # Audited from data/feeds_curated_by_alina_allowed_to_go_public.yaml.
  # Only live feeds hosted by the organization that authored the content are
  # admitted here. Media, social proxies, community feeds, broad arXiv feeds,
  # broken endpoints, and third-party Anthropic mirrors stay out of scored
  # evidence. Entries are filtered locally for benchmark/data relevance.
  first_party_feeds:
    enabled: true
    required: false
    allow_empty: true
    attempts: 3
    timeout_seconds: 30
    keywords:
      - benchmark
      - evaluation
      - evals
      - leaderboard
      - dataset
      - test set
      - data contamination
      - data quality
    feeds:
      - name: Meituan Engineering
        url: https://tech.meituan.com/rss.xml
      - name: OpenAI News
        url: https://openai.com/news/rss.xml
      - name: Google AI
        url: https://blog.google/innovation-and-ai/technology/ai/rss/
      - name: Google DeepMind
        url: https://deepmind.google/blog/rss.xml
      - name: Google Research
        url: https://research.google/blog/rss/
      - name: Apple Machine Learning Research
        url: https://machinelearning.apple.com/rss.xml
      - name: AWS Machine Learning
        url: https://aws.amazon.com/blogs/machine-learning/feed/
        require_any:
          - ai
          - llm
          - language model
          - foundation model
          - generative
          - agent
          - model
          - inference
          - reasoning
      - name: Hugging Face Blog
        url: https://huggingface.co/blog/feed.xml
      - name: Microsoft Research
        url: https://www.microsoft.com/en-us/research/feed/
        require_any:
          - ai
          - llm
          - language model
          - foundation model
          - generative
          - agent
          - model
          - inference
          - reasoning
      - name: NVIDIA AI Blog
        url: https://blogs.nvidia.com/feed/
      # Added issue #98 pass: major LLM vendors with a verified live
      # first-party feed. Each was fetched and confirmed to return XML before
      # admission. Vendors whose sites serve no first-party syndication feed
      # (Anthropic, xAI, Cohere, DeepSeek, Qwen, Moonshot, Z.ai, Reka,
      # Cerebras, AI21, Databricks, Perplexity) stay out: a missing feed is
      # not filled with a third-party proxy.
      - name: Mistral AI
        url: https://mistral.ai/news/rss
      - name: Meta Research
        url: https://research.facebook.com/feed/
      - name: Ai2
        url: https://allenai.org/rss.xml
      - name: Together AI
        url: https://www.together.ai/blog/rss.xml
      - name: Sakana AI
        url: https://sakana.ai/feed.xml
      # Added issue #264 pass, 2026-08-20. Each URL below was fetched and
      # confirmed to parse as RSS or Atom with at least one titled, linked
      # entry. Anthropic, DeepSeek, Moonshot AI, Z.ai and xAI were re-checked
      # in the same pass and still serve no first-party feed; they are routed
      # through the domain-constrained Brave searches below instead. The
      # per-vendor verdicts, including rejected candidates, are recorded in
      # data/vendor_feed_verification.yml.
      - name: Qwen
        url: https://qwenlm.github.io/blog/index.xml
      - name: Ollama
        url: https://ollama.com/blog/rss.xml
      - name: Stability AI
        url: https://stability.ai/news-updates?format=rss
      - name: Nomic AI
        url: https://www.nomic.ai/feed.xml
      - name: Replicate
        url: https://replicate.com/blog/rss
      - name: NVIDIA Developer
        url: https://developer.nvidia.com/blog/feed/
        require_any:
          - ai
          - llm
          - language model
          - foundation model
          - generative
          - agent
          - model
          - inference
          - reasoning
      - name: IBM Research
        url: https://research.ibm.com/rss
        require_any:
          - ai
          - llm
          - language model
          - foundation model
          - generative
          - agent
          - model
          - inference
          - reasoning
      - name: Databricks
        url: https://www.databricks.com/feed
        require_any:
          - ai
          - llm
          - language model
          - foundation model
          - generative
          - agent
          - model
          - inference
          - reasoning
      - name: LangChain
        url: https://www.langchain.com/blog/rss.xml

  openalex:
    enabled: true
    searches:
      - large language model benchmark
      - artificial intelligence evaluation dataset
      - benchmark contamination data quality
      - agentic benchmark evaluation

  brave:
    enabled: true
    searches:
      - new AI benchmark evaluation dataset
      - new LLM benchmark leaderboard
      - AI dataset release data quality
      - new agentic AI benchmark leaderboard
      # Official pages whose RSS endpoints in Alina's list are missing,
      # unofficial, or broken. Search remains first-party-domain constrained.
      - site:anthropic.com/news benchmark evaluation dataset
      - site:anthropic.com/research benchmark evaluation dataset
      - site:anthropic.com/engineering benchmark evaluation dataset
      - site:ai.meta.com/blog benchmark evaluation dataset
      - site:blogs.microsoft.com/ai benchmark evaluation dataset
      - site:mistral.ai/news benchmark evaluation dataset
      - site:stability.ai/news benchmark evaluation dataset
      - site:01.ai/blog benchmark evaluation dataset
      # Issue #264 re-check: these vendors publish model cards we track but
      # still serve no first-party feed, and had no fallback path at all.
      - site:api-docs.deepseek.com/news benchmark evaluation dataset
      - site:qwen.ai benchmark evaluation dataset
      - site:kimi.ai/blog benchmark evaluation dataset
      - site:z.ai/blog benchmark evaluation dataset
      - site:x.ai/news benchmark evaluation dataset

attention:
  hacker_news:
    enabled: true
    # Keep the v1 producer namespace so observation IDs remain stable after
    # moving collection out of benchmark-social-signal.
    producer: benchmark-social-signal
    lookback_hours: 168
    items_per_query: 40
    queries:
      - AI benchmark
      - LLM evaluation
      - machine learning dataset
      - model leaderboard
    taxonomy:
      benchmark: [benchmark, leaderboard, challenge set]
      evaluation: [evaluation, eval, judge model]
      dataset: [dataset, corpus, training data, synthetic data]
      data_quality: [data quality, contamination, deduplication, provenance, leakage]

publish:
  dashboard_url: "https://benchmark-radar.org/"
  issue_title_prefix: "📡 AI Benchmark & Data Radar"
  labels:
    - daily-radar
    - automated
