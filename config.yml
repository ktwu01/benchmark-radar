radar:
  lookback_hours: 48
  max_items_per_source: 60
  report_limit: 30
  minimum_score: 2.0

taxonomy:
  benchmark:
    - benchmark
    - leaderboard
    - test set
    - challenge set
    - evaluation suite
  evaluation:
    - evaluation
    - evaluator
    - judge model
    - red teaming
    - capability eval
    - safety eval
  dataset:
    - dataset
    - corpus
    - data collection
    - synthetic data
    - training data
    - preference data
  data_quality:
    - data quality
    - data contamination
    - deduplication
    - data provenance
    - annotation quality
    - benchmark leakage

sources:
  arxiv:
    enabled: true
    required: true
    # 48h report window + 120h overlap = seven days. arXiv's Atom published
    # timestamp is submission time, while announcements pause on weekends.
    overlap_hours: 120
    request_delay_seconds: 3
    # GitHub-hosted runners are routinely rate-limited by the Atom API's
    # shared-IP quota. Use official category RSS feeds and filter locally.
    # Atom parsing remains available for deployments with a stable egress IP.
    atom_enabled: false
    rss_categories: [cs.AI, cs.CL, cs.CV]
    rss_keywords:
      - benchmark
      - evaluation
      - evaluator
      - leaderboard
      - dataset
      - test set
      - data contamination
      - benchmark leakage
      - data quality
    queries:
      - 'all:"large language model" AND (all:benchmark OR all:evaluation)'
      - '(all:benchmark OR all:dataset) AND (cat:cs.AI OR cat:cs.CL OR cat:cs.CV)'
      - '(all:"data contamination" OR all:"benchmark leakage" OR all:"data quality")'

  huggingface:
    enabled: true
    required: true
    kinds: [datasets]
    searches:
      - benchmark
      - evaluation
      - leaderboard
      - preference
      - synthetic-data

  github:
    enabled: true
    required: true
    queries:
      - '"LLM benchmark" in:name,description,readme'
      - '"AI evaluation" in:name,description,readme'
      - '"benchmark dataset" in:name,description,readme'
      - '"data contamination" in:name,description,readme'

  openalex:
    enabled: true
    searches:
      - large language model benchmark
      - artificial intelligence evaluation dataset
      - benchmark contamination data quality

  brave:
    enabled: true
    searches:
      - new AI benchmark evaluation dataset
      - new LLM benchmark leaderboard
      - AI dataset release data quality

attention:
  feeds:
    - name: Benchmark Social Signal
      enabled: true
      url: "https://raw.githubusercontent.com/ktwu01/benchmark-social-signal/main/feed.json"

publish:
  dashboard_url: "https://ktwu01.github.io/benchmark-radar/"
  issue_title_prefix: "📡 AI Benchmark & Data Radar"
  labels:
    - daily-radar
    - automated
