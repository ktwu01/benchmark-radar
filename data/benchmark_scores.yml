results:
  # ---------------------------------------------------------------------------
  # Gemini 1.5 technical report (arXiv 2403.05530), Table 11.
  # Read from pdftotext output. Column order in the source is
  # 1.0 Pro | 1.0 Ultra | 1.5 Flash | 1.5 Pro; the values below are the last
  # column. Shot counts are printed under each value and are carried into
  # `protocol` because they are part of what the number means.
  # ---------------------------------------------------------------------------

  - benchmark_id: mmlu
    instrument: mmlu
    protocol: 5-shot
    model: Gemini 1.5 Pro
    organization: Google DeepMind
    source_id: google_gemini_1_5_report
    reported_at: 2024-03-08
    value: 85.9
    read_from: pdf_text

  - benchmark_id: gsm8k
    instrument: gsm8k
    protocol: 11-shot
    model: Gemini 1.5 Pro
    organization: Google DeepMind
    source_id: google_gemini_1_5_report
    reported_at: 2024-03-08
    value: 90.8
    read_from: pdf_text

  # The source labels this row "HumanEval chat preamble*", 0-shot. The preamble
  # is part of the protocol: the same table's footnote records that finetuning on
  # the test split moved this metric from 74.4% to 89.0%, which is exactly how
  # sensitive this instrument is to setup.
  - benchmark_id: humaneval
    instrument: humaneval
    protocol: 0-shot, chat preamble
    model: Gemini 1.5 Pro
    organization: Google DeepMind
    source_id: google_gemini_1_5_report
    reported_at: 2024-03-08
    value: 84.1
    read_from: pdf_text

  # Printed as a bare F1 score, not a percentage with a % sign.
  - benchmark_id: drop
    instrument: drop
    protocol: variable shots, F1
    model: Gemini 1.5 Pro
    organization: Google DeepMind
    source_id: google_gemini_1_5_report
    reported_at: 2024-03-08
    value: 74.9
    read_from: pdf_text

