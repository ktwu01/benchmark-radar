# Benchmark Score Progression (issue #91)
#
# `model_cards.yml` records *mentions*: which benchmarks a vendor chose to put in
# front of readers. It deliberately stores no score, because a mention survives
# every configuration caveat that makes two reported scores incomparable. That
# decision stands. This file is the narrow additive layer that lets the site draw
# a score progression where -- and only where -- a real number was read out of a
# real document.
#
# WHAT THIS IS NOT
#
# Not a saturation metric. A "highest score so far" line rises or stays flat by
# construction, so it cannot be evidence of saturation; a flat run is equally
# consistent with the benchmark being saturated, with vendors having stopped
# reporting it, with a protocol change, or with a version bump. Saturation
# remains an editorial judgement carried by the per-benchmark `caveat` in
# model_cards.yml ("Saturated and heavily contaminated" for MMLU), written by a
# human reading the field. Nothing here computes it.
#
# Not a leaderboard. Vendors publish the benchmarks they do well on, so these
# rows are missing-not-at-random. A progression built from model cards partly
# measures reporting choice, not capability.
#
# THE JOIN RULE
#
# `protocol` is the comparability class. Two rows may be connected by a line ONLY
# if `instrument` AND `protocol` are both identical. The string encodes whatever
# the source said moves the number. Silence is not agreement: two documents that
# both omit tool access are not evidence that their setups matched, so an
# unstated condition is never treated as equal to another unstated condition --
# it just means those rows do not join.
#
# `instrument` is the version identity, separate from `benchmark_id`. Terminal-
# Bench 2.0 and 2.1 share a benchmark_id and are different instruments (2.1
# changed 28 of 89 tasks), so a line must break at that boundary rather than
# attribute a task-set change to model progress. Same for HumanEval vs
# HumanEval-Mul, LiveCodeBench vs LiveCodeBench v5, GPQA full vs Diamond.
#
# PROVENANCE
#
# Every row names the `source_id` it was read from, which must exist in
# model_cards.yml, and `read_from` records how: `pdf_text` and `html_text` were
# machine-extracted from the document and re-read against the printed table;
# `table_image` would mean transcribed from a rendered image.
#
# `organization` is whose model was measured. `reported_by` is who published the
# document. When they differ the row is a third-party citation: the publisher is
# repeating a competitor's self-reported figure, which is weaker evidence than a
# vendor reporting its own model, and weaker still when the publisher had a stake
# in the comparison. Those rows are recorded with reported_by set and are marked
# in the UI rather than silently mixed in.
#
# A NOTE ON PRECISION
#
# GPQA Diamond has 198 items, so single-run accuracy can only land on multiples
# of 1/198 (about 0.505 points): 182 correct is 91.9%, 183 is 92.4%. A reported
# 92.1% therefore cannot be a plain single-run accuracy over the full split -- it
# implies averaging over runs, a subset, or a transcription error. Values are
# recorded exactly as printed, and this is why `protocol` carries the run
# treatment when the source states it.
#
# HOW TO ADD A ROW
#
# Read the number out of the cited document yourself. Record it exactly as
# printed. If the document publishes its table as an image and the value cannot
# be read with certainty, add nothing: an absent row is honest, a guessed row is
# not. Then run `benchmark-radar rebuild`.

