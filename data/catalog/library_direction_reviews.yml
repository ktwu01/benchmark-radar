# Hand-reviewed research directions for curated records that no exact join
# reaches. Hand-edited, never bulk-populated.
#
# The Library groups benchmarks into the taxonomy-v5 directions exported from
# benchmark-radar.com (claire_library_categories.json). Most records receive a
# direction through exact identity (library_directions.py). The model-report
# registry and the Artificial Analysis snapshot are curated here, and their most
# read entries -- AIME, MMLU, SWE-bench Verified, Humanity's Last Exam -- share no
# exact identifier with a .com record, so they would otherwise sit in "not yet
# classified".
#
# Each entry was assigned by reading the registry caveat or source description,
# one benchmark at a time; a registry `domain` is not mapped mechanically,
# because "multimodal", "agent" and "reasoning" each span several directions.
# An exact join always wins over an entry here, so this file only fills gaps.
