  # ---------------------------------------------------------------------
  # Issue #303 Phase A: repositories resolved for the observation_count >= 20
  # tier that had no in-corpus donor. Repository identity only: publisher,
  # release date, licences and sizes are absent because Phase A did not verify
  # them, not because they do not exist. Rows are ordered by observation count,
  # continuing the order above.
  #
  # Ten rows resolve to a repository that is not specific to the benchmark. The
  # yml has no repo_kind field, so each such note opens by saying so: nine are
  # a shared parent (the variant is evaluated from a parent project's repo) and
  # one is a monorepo subdirectory. A parent's repo is recorded as a finding,
  # never as a stand-in for a repo the variant does not have.
  #
  # Reviewer correction applied to the crawl, recorded so a later pass does not
  # silently re-introduce it:
  #   mmbench-v1.1  The crawl's second anchor was arXiv 2311.17076
  #                 ('Compositional Chain-of-Thought Prompting'), which cites
  #                 MMBench but is not MMBench's own paper. The repo README's
  #                 first line links the real one, arXiv 2307.06281, and that is
  #                 what is recorded here.
  #   include       The crawl returned needs_review with no repository candidate:
  #                 the only GitHub URL on the official dataset card is a
  #                 commented-out placeholder pointing at a user profile. With
  #                 nothing to review it is not_found, like aime-2024.
  #
  # Eleven of the 38 benchmarks in this tier are deliberately absent: nine
  # found no repository (aime-2024, arc-c, ai2d, realworldqa, docvqa, include,
  # mrcr-v2-(8-needle), polymath, wmt24++) and two carry a repository candidate
  # that could not be pinned to the right instance (hmmt25, t2-bench). They stay
  # in the issue thread rather than appearing here with a guess.
  # ---------------------------------------------------------------------

