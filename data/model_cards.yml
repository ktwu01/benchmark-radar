  - id: browsecomp
    name: BrowseComp
    aliases: ["BrowseComp"]
    domain: agent
    url: https://openai.com/index/browsecomp/
    released: 2025-04-10
    caveat: >-
      Live web. The result depends on what the internet contained on the day
