[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benchmark-radar"
version = "0.1.0"
description = "Daily evidence-first radar for AI benchmarks, evaluations, datasets, and data quality."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "certifi>=2025.1.31",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
benchmark-radar = "benchmark_radar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
