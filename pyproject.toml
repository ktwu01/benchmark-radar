[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benchmark-radar"
version = "0.11.0"
description = "Benchmark Radar: A Living Database and Search Engine for AI Benchmarks and Evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "certifi>=2025.1.31",
  "tiktoken>=0.11,<1",
  "PyYAML>=6.0.2,<7",
  "openreview-py>=2.4,<3",
]

[project.optional-dependencies]
dev = [
  "Pillow>=11,<14",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
benchmark-radar = "benchmark_radar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the checkout's own src/ win over the installed editable package. Without
# this, running pytest from a git worktree imports benchmark_radar from whichever
# checkout was pip-installed, so the tests silently measure the wrong source tree.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
