<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Benchmark Radar · Research Explorer</title><meta name="description" content="Explore benchmark research fields, reported scores and their source evidence."><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/research.css"><link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/design-system.css"><link rel="canonical" href="https://benchmark-radar.org/research/">{{i18n}}</head>
<body>
<a class="skip-link" href="#benchmarks">Skip to benchmarks</a>
{{header}}<div id="radar-explorer">
<div class="workspace"><aside class="sidebar"><div class="sidebar-heading" data-en="Research fields" data-zh="研究领域">Research fields</div><nav id="field-nav" aria-label="Research fields"></nav><div id="subfield-nav"></div><div class="sidebar-bottom"><a href="/cite/" target="_blank" rel="noopener" data-en="About the research ↗" data-zh="关于这项研究 ↗">About the research ↗</a></div></aside>
<main class="main"><div class="page-heading"><div><h1 id="page-title">Research explorer</h1></div><button class="export-button" id="export" type="button" data-en="↓ Export view" data-zh="↓ 导出当前结果">↓ Export view</button></div>
<div id="load-state" role="status">Loading the complete catalog…</div>
<div id="loaded-content" hidden><section id="field-grid" class="field-grid" aria-label="Explore research fields"></section>
<section class="catalog-section" id="benchmarks"><div class="section-heading"><div class="view-tabs" role="tablist" aria-label="Catalog view"><button type="button" id="list-tab" role="tab" aria-selected="true" aria-controls="catalog-panel" data-en="Benchmarks" data-zh="Benchmark 列表">Benchmarks</button><button type="button" id="coverage-tab" role="tab" aria-selected="false" aria-controls="coverage-panel" data-en="Score coverage" data-zh="分数覆盖情况">Score coverage</button></div></div>
<div class="research-explorer-directions" data-expanded="false"><button type="button" id="direction-toggle" class="research-scope-toggle" aria-expanded="false" aria-controls="direction-tabs">Research directions</button><nav id="direction-tabs" class="research-direction-tabs" aria-label="Research directions"></nav></div><div class="filter-row"><label class="search-wrap"><span aria-hidden="true">⌕</span><input id="name-filter" type="search" placeholder="Filter benchmark names…" aria-label="Filter benchmark names"><kbd>/</kbd></label><select id="source-filter" aria-label="Data source"><option value="">All sources</option></select><select id="score-filter" aria-label="Score range"><option value="all">All score ranges</option><option value="under70">Below 70%</option><option value="70to90">70–90%</option><option value="over90">90% and above</option><option value="unknown">No reported score</option><option value="unverified">Other / unverified scale</option></select></div>
<div class="result-bar"><div id="result-count" role="status" aria-live="polite"></div><label class="sort-label"><span data-en="Sort" data-zh="排序">Sort</span><select id="sort" aria-label="Sort benchmarks"><option value="models">Scored models ↓</option><option value="name">Name A–Z</option><option value="date">Release date ↓</option><option value="documents">Source documents ↓</option></select></label><button id="clear" class="clear-button" type="button" hidden data-en="Clear filters" data-zh="清除筛选">Clear filters</button></div>
<div id="coverage-panel" role="tabpanel" aria-labelledby="coverage-tab" hidden></div>
<div id="catalog-panel" role="tabpanel" aria-labelledby="list-tab"><div class="table-scroll"><table><thead><tr><th data-en="Benchmark" data-zh="Benchmark">Benchmark</th><th data-en="Field" data-zh="领域">Field</th><th class="score-th" data-en="Highest score" data-zh="最高已报告分数">Highest score</th><th data-en="Scored models" data-zh="模型数">Scored models</th><th data-en="Released" data-zh="发布日期">Released</th><th><span class="sr-only">Details</span></th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty" hidden></div><div class="pagination"><span id="page-info"></span><div><button id="previous" type="button" aria-label="Previous page">←</button><button id="next" type="button" aria-label="Next page">→</button></div></div></div>
<details class="method-note"><summary data-en="About the data" data-zh="关于数据">About the data</summary><p id="method-copy"></p></details></section>
<footer class="main-footer"><span>Benchmark Radar · Koutian Wu & contributors</span></footer></div></main></div>
<dialog id="detail-dialog" aria-labelledby="detail-title"><div id="detail-content"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
</div><script type="module" src="/assets/research.js"></script></body></html>
