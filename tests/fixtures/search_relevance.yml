schema_version: 2

cases:
  - id: math-reasoning
    query: math reasoning
    scope: catalog
    kind: topical
    must_include: [MATH, MATH-500, SAT Math]

  - id: visual-reasoning
    query: visual reasoning
    scope: catalog
    kind: topical
    must_include: [MMMU-Pro, AI2D]

  - id: long-horizon-agent
    query: long horizon agent
    scope: catalog
    kind: topical
    # The full Claire Library changes corpus IDF and introduces genuinely
    # relevant names. Older examples remain covered by exact-name lookup.
    must_include: [SWE-Marathon, Long-Horizon-Terminal-Bench]

  - id: coding-benchmark
    query: coding benchmark
    scope: catalog
    kind: topical
    must_include: [WildClawBench, Aider-Polyglot, SciCode]

  - id: medical-vqa
    query: medical VQA
    scope: catalog
    kind: topical
    must_include: [MedBookVQA, PMC-VQA, VQA-Rad]

  # These are known gaps in this catalog version, not globally negative intents.
  # Search should preserve partial lexical candidates for the agent to inspect,
  # while never presenting one as a full-query lexical match.
  - id: protein-structure-prediction
    query: protein structure prediction
    scope: catalog
    kind: catalog_gap
    expected_status: partial_candidates_only
    minimum_candidates: 1
    must_include_candidates: [StructTokenBench]

  - id: weather-forecasting
    query: weather forecasting
    scope: catalog
    kind: catalog_gap
    # New financial/trajectory forecasting records match only "forecasting";
    # they must remain partial candidates, never weather suitability claims.
    expected_status: partial_candidates_only
    minimum_candidates: 1
    must_include_candidates: [ProForma-20Q]

  - id: stock-prediction
    query: stock prediction
    scope: catalog
    kind: catalog_gap
    expected_status: partial_candidates_only
    minimum_candidates: 1
    must_include_candidates: []

  - id: robot-grasp-planning
    query: robot grasp planning
    scope: catalog
    kind: catalog_gap
    expected_status: partial_candidates_only
    minimum_candidates: 1
    must_include_candidates: []
